enable_maintenance:
  name: Enable Maintenance Window
  description: Starts an on-demand LogShed maintenance window to silence alerts and optionally drop error logs. Returns the session ID of each window it starts.
  fields:
    config_entry_id:
      name: LogShed Instance
      description: The LogShed instance to start the window on. Starts one window on every loaded instance if omitted.
      required: false
      selector:
        config_entry:
          integration: logshed
    duration_minutes:
      name: Duration (Minutes)
      description: Length of the maintenance session in minutes.
      default: 30
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    reason:
      name: Reason
      description: Descriptive reason for the maintenance window for audit logs.
      default: Home Assistant automation
      required: false
      selector:
        text:
    log_handling:
      name: Log Handling
      description: Silence alerts only, or silence alerts and drop error logs.
      default: silence_alerts
      required: false
      selector:
        select:
          options:
            - label: Silence alerts only
              value: silence_alerts
            - label: Silence alerts & drop error logs
              value: drop_errors
    target_app:
      name: Target App / Container
      description: Optional filter to drop errors only from a specific application or container.
      required: false
      selector:
        text:
    target_host:
      name: Target Host
      description: Optional filter to drop errors only from a specific host machine.
      required: false
      selector:
        text:

disable_maintenance:
  name: Disable Maintenance Window
  description: Ends LogShed maintenance windows. Pass the session ID returned by Enable Maintenance Window to end only that window; without a session ID, every on-demand window is ended, including windows started from the LogShed web UI, MCP clients or other automations. Scheduled windows are never ended.
  fields:
    config_entry_id:
      name: LogShed Instance
      description: The LogShed instance to end windows on. Applies to every loaded instance if omitted.
      required: false
      selector:
        config_entry:
          integration: logshed
    session_id:
      name: Session ID
      description: The maintenance session to end, as returned by Enable Maintenance Window. If omitted, every active on-demand session is ended.
      required: false
      selector:
        text:
